<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissin Form</title>
</head>
<body>
    <h3>Admission Form</h3>
    <form>
        <label for="">Name: 
            <input type="text" placeholder="Enter your name" required>
        </label>
        <br>
        <br>
        <label for="">Email:
            <input type="email" placeholder="Enter your email" required> 
        </label>   
        <br>
        <br>
        <label for="">Phone:
            <input type="tel" name="" id="" placeholder="Your Phone Number" required>
        </label>

        <br>
        <br>

        <label for="">Gender:
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female    
        </label>

        <br>
        <br>

        <label for="">Interest: 
            <input type="checkbox" name="interest" id=""> Travel
            <input type="checkbox" name="interest" id=""> Sports
            <input type="checkbox" name="interest"> Music
        </label>

        <br> 
        <br>

        <label for="">Message: 
            <textarea name="" id="" cols="30" rows="5"></textarea>
        </label>

        <br>
        <br>
        <label for="">Password:
            <input type="password" placeholder="Enter your password" required>

        </label>

        <br>
        <br>
        <label for="">
            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </label>


    </form>

</body>
</html>
